<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Linkit - Discover</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      extend: {

                "on-error": "#ffffff",
                "primary-fixed-dim": "#4ae176",
                "on-primary-container": "#004b1e",
                "primary-container": "#22c55e",
                "inverse-surface": "#213145",
                "on-primary": "#ffffff",
                "primary": "#006e2f",
                "on-secondary-fixed-variant": "#2f2ebe",
                "on-surface-variant": "#3d4a3d",
                "on-secondary": "#ffffff",
                "on-tertiary": "#ffffff",
                "tertiary-fixed": "#ffdbca",
                "outline-variant": "#bccbb9",
                "on-primary-fixed": "#002109",
                "tertiary": "#9d4300",
                "surface-tint": "#006e2f",
                "tertiary-fixed-dim": "#ffb690",
                "on-primary-fixed-variant": "#005321",
                "on-error-container": "#93000a",
                "surface-container-highest": "#d3e4fe",
                "surface-variant": "#d3e4fe",
                "secondary": "#4648d4",
                "on-surface": "#0b1c30",
                "tertiary-container": "#ff8e4d",
                "secondary-container": "#6063ee",
                "on-tertiary-container": "#6d2d00",
                "on-tertiary-fixed-variant": "#783200",
                "outline": "#6d7b6c",
                "surface-dim": "#cbdbf5",
                "primary-fixed": "#6bff8f",

                "on-tertiary-fixed": "#341100",
                "surface-bright": "#f8f9ff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "base": "4px",
                "margin-desktop": "48px",
                "xl": "32px",
                "gutter": "16px",
                "sm": "12px",
                "md": "16px",
                "lg": "24px",
                "xs": "8px",
                "margin-mobile": "16px"
        },
        "fontFamily": {
                "body-sm": [
                        "Plus Jakarta Sans"
                ],
                "label-bold": [
                        "Plus Jakarta Sans"
                ],
                "display-lg": [
                        "Plus Jakarta Sans"
                ],
                "headline-lg-mobile": [
                        "Plus Jakarta Sans"
                ],
                "headline-lg": [
                        "Plus Jakarta Sans"

                "title-md": [

                ],
                "body-lg": [

                ]
        },
        "fontSize": {

                "headline-lg": [

                                "letterSpacing": "-0.01em",

                "title-md": [
                        "20px",
                        {

</head>
<body class="bg-surface text-on-surface font-body-sm h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface shadow-sm transition-colors">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="hub">hub</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Linkit</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto pt-14 pb-[80px] px-margin-mobile relative mt-sm">
<!-- Card Stack Area -->
<div class="relative flex-1 w-full flex items-center justify-center">
<!-- Background Card 2 (Bottom) -->
<div class="absolute w-full h-[90%] bg-surface-container-high rounded-xl shadow-sm transform scale-90 translate-y-6 opacity-60"></div>
<!-- Background Card 1 (Middle) -->
<div class="absolute w-full h-[90%] bg-surface-container-highest rounded-xl shadow-sm transform scale-95 translate-y-3 opacity-80"></div>
<!-- Foreground Card (Active) -->
<div class="absolute w-full h-[90%] bg-surface-container-lowest rounded-xl shadow-lg overflow-hidden flex flex-col z-10 cursor-grab active:cursor-grabbing transform transition-transform duration-300">
<div class="relative flex-1 w-full bg-surface-container">
<img alt="Sisi Profile Picture" class="absolute inset-0 w-full h-full object-cover object-center" data-alt="A candid, vibrant portrait of a young female architecture student in her early twenties, standing outdoors on a bright university campus. She is casually dressed in modern streetwear, smiling naturally with a relaxed posture. The lighting is sunny and energetic, highlighting a light-mode aesthetic with bright greens from the campus trees and soft white architectural structures in the background. The mood is youthful, approachable, and creative." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-yDJlCih76kZPfMbSihRCulm3wWERYbKKiVdbgCLe5q_QybXzx8Kj8FCWZwzbHWZd-XWEuX2y9f_g1wUS84o3raGZKnSeUUPjdFXqpl2SgQks604HOVlyZW0HcC8sibgPGqTlFQDpvxbXCWkwpiHMKRpx67oQIYKbpVIKpJLHfu562x5WeQkUiW2x2qqSQADOWnMu1XT7qgQyR8ZkGggCVRo-J8EmhpPsjLvmqRYv_9ZgI95Bj4hh8E5XeteLCZOVLQQGBIDD-d00"/>
<!-- Gradient Scrim for Text Readability -->
<div class="absolute inset-x-0 bottom-0 h-1/2 scrim-gradient pointer-events-none"></div>
<!-- Card Info Overlay -->
<div class="absolute bottom-0 left-0 w-full p-margin-mobile text-white flex flex-col gap-xs">
<div class="flex items-end gap-sm mb-xs">
<h2 class="font-display-lg text-display-lg text-white drop-shadow-md">Sisi</h2>
<span class="font-title-md text-title-md text-white opacity-90 drop-shadow-md pb-xs">21</span>
</div>
<div class="flex items-center gap-xs text-white opacity-90 font-body-sm">
<span class="material-symbols-outlined text-[18px]">school</span>
<span class="">Arch School, Junior</span>
</div>
<!-- Interests Pills -->
<div class="flex flex-wrap gap-xs mt-sm">
<span class="bg-white/20 backdrop-blur-md px-sm py-xs rounded-full font-label-bold text-label-bold text-white border border-white/10">
                                Coffee
                            </span>
<!-- Highlighted Common Interest -->
<span class="bg-secondary-container px-sm py-xs rounded-full font-label-bold text-label-bold text-on-secondary-container shadow-sm border border-secondary/20 flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">favorite</span>
                                Photography
                            </span>
<span class="bg-white/20 backdrop-blur-md px-sm py-xs rounded-full font-label-bold text-label-bold text-white border border-white/10">
                                CityWalk
                            </span>
</div>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex justify-center items-center gap-lg mt-md h-[80px] z-20">
<!-- Dislike Action -->
<button class="w-12 h-12 rounded-full bg-surface-container shadow-sm flex items-center justify-center text-error hover:bg-error-container active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<!-- Main Central Action (Get to Know Her) -->
<button class="flex items-center justify-center gap-xs px-lg py-sm h-14 rounded-full bg-primary shadow-md text-on-primary font-body-lg text-body-lg active:scale-95 hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 group relative overflow-hidden">
<span class="material-symbols-outlined transition-transform group-hover:rotate-90 duration-300">add</span>
<span class="font-bold">Get to Know Her</span>
</button>
<!-- Chat/Details Action -->
<button class="w-12 h-12 rounded-full bg-surface-container shadow-sm flex items-center justify-center text-primary hover:bg-primary-container active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]">chat_bubble</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface border-t border-outline-variant transition-colors">
<!-- Inactive Tab: Plaza -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all duration-200 px-4 py-1 group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">home</span>
<span class="font-label-bold text-label-bold mt-xs">Plaza</span>
</button>
<!-- Active Tab: Discover -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">style</span>
<span class="font-label-bold text-label-bold mt-xs font-bold">Discover</span>
</button>
<!-- Inactive Tab: Chats -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all duration-200 px-4 py-1 group">
<div class="relative">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">chat_bubble</span>
<span class="absolute top-0 right-0 w-2 h-2 bg-secondary rounded-full border border-surface"></span>
</div>
<span class="font-label-bold text-label-bold mt-xs">Chats</span>
</button>
</nav>
</body></html>
